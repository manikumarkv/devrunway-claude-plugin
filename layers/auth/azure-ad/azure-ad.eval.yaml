skill: azure-ad-auth
skill_files:
  - layers/auth/azure-ad/SKILL.md
  - layers/auth/azure-ad/azure-ad.md
version: 1

cases:
  - id: azad-01
    name: "MSAL used for token acquisition not raw JWT decode"
    scenario: |
      Write the browser-side Azure AD authentication setup for a React SPA.
      Use the azure-ad-auth skill rules.
    must_contain:
      - "PublicClientApplication"
      - "acquireTokenSilent("
    must_not_contain:
      - "jwt.decode("
    rationale: |
      MSAL handles token acquisition, caching, and refresh automatically.
      jwt.decode only decodes without cryptographic verification.

  - id: azad-02
    name: "Silent token refresh with interactive fallback"
    scenario: |
      Write the function that gets a valid access token for API calls,
      refreshing silently or prompting interactively. Use the azure-ad-auth skill rules.
    must_contain:
      - "acquireTokenSilent"
      - "acquireTokenPopup"
    must_not_contain:
      - "localStorage.setItem('token'"
    rationale: |
      acquireTokenSilent refreshes tokens without user interaction.
      Falling back to acquireTokenPopup handles expired refresh tokens.
      Storing tokens in localStorage is insecure.

  - id: azad-03
    name: "Audience validated in token verification"
    scenario: |
      Write the server-side middleware that validates an Azure AD JWT.
      Use the azure-ad-auth skill rules.
    must_contain:
      - "audience"
      - "clientId"
    rationale: |
      Audience validation ensures the token was issued for this specific API.
      Without it, a token issued for another app could be used here.

  - id: azad-04
    name: "Token rejection uses the api-conventions envelope, not library error text"
    scenario: |
      Write the Express middleware response for a request whose Azure AD token is
      missing or fails verification. Use the azure-ad-auth skill rules.
    must_contain:
      - "success: false"
      - "code:"
    must_not_contain:
      - ".message"
    rationale: |
      Cross-layer guard against `api-conventions` and `security-principles`. This
      layer returned `res.status(401).json({ error: "Missing token" })` — a bare body
      the client cannot branch on, in a layer whose own Related-skills line claims
      `api-conventions`.

      Discriminates: the shipped bare body scores 0 (neither `success: false` nor
      `code:`). Second spelling, `res.status(401).json({ message: 'Invalid token' })`,
      also scores 0. Third, `res.sendStatus(401)` — which a `res.status(401)` guard
      would have missed entirely — scores 0 too, since it carries no envelope.
      `.message` is written receiver-free so it catches `err.message`, `e.message`
      and `error.message` alike; the layer requires the error object to be handed to
      the logger, so compliant code never dereferences it. The literal does not
      appear in this layer's skill_files.
