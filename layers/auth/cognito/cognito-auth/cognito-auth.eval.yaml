skill: cognito-auth
skill_files:
  - layers/auth/cognito/cognito-auth/SKILL.md
version: 1

cases:
  - id: cauth-01
    name: "Amplify configured once at app root"
    scenario: |
      Write the app entry point that configures AWS Amplify for a React app.
      Use the cognito-auth skill rules.
    must_contain:
      - "Amplify.configure("
      - "aws-exports"
    rationale: |
      Amplify.configure must be called exactly once at app startup.
      Calling it per component or per request creates multiple instances.

  - id: cauth-02
    name: "fetchAuthSession for current tokens not localStorage"
    scenario: |
      Write a function that retrieves the current user's access token for
      use in API calls. Use the cognito-auth skill rules.
    must_contain:
      - "fetchAuthSession("
    must_not_contain:
      - "localStorage.getItem('token'"
    rationale: |
      fetchAuthSession handles token refresh automatically. localStorage
      stores tokens insecurely and misses expiry handling.

  - id: cauth-03
    name: "signOut clears session completely"
    scenario: |
      Write the logout function for a Cognito-authenticated app.
      Use the cognito-auth skill rules.
    must_contain:
      - "signOut("
    must_not_contain:
      - "localStorage.removeItem"
      - "document.cookie"
    rationale: |
      signOut() calls Cognito to invalidate the session globally.
      Just clearing local storage leaves server-side sessions active.

  - id: cauth-04
    name: "LoginForm fields have real labels, not placeholder + aria-label"
    scenario: |
      Write the Cognito LoginForm component with email and password fields and
      an error message for a failed sign-in. Use the cognito-auth skill rules.
    must_contain:
      - "<label"
      - "htmlFor="
      - "aria-describedby"
    must_not_contain:
      - "placeholder="
      - "aria-label="
    rationale: |
      Cross-layer guard. The universal `accessibility` skill is always on, and
      a11y-01 requires `<label` and forbids `placeholder=`. This layer used to ship a
      LoginForm built from `placeholder="Email"` + `aria-label="Email"` with no label
      element, so code scaffolded from it failed the accessibility suite on the most
      screen-read form in the product.

      Discriminates: the shipped placeholder + aria-label form scores 0 (no `<label`,
      contains both forbidden literals). The second spelling — labels present but the
      password field still carrying `placeholder="••••••••"` as a hint — also scores 0
      on `placeholder=`. A form with labels but an unlinked `<p className="error">`
      scores 0 on `aria-describedby`.

      `htmlFor=` is required rather than accepting the wrapping-label form that
      accessibility.md also permits, because this scaffold gives both fields ids for
      `aria-describedby` regardless, and the SKILL.md text states the explicit
      association as this layer's rule. The prose above the code block writes
      `placeholder` and `aria-label` without a trailing `=`, so neither
      must_not_contain literal appears in skill_files.
