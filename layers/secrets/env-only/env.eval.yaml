skill: env-secrets
skill_files:
  - layers/secrets/env-only/SKILL.md
  - layers/secrets/env-only/env-only.md
version: 1

cases:
  - id: env-01
    name: "Environment variables validated with Zod at startup"
    scenario: |
      Write the env validation module that checks required environment
      variables at app startup. Use the env-secrets skill rules.
    must_contain:
      - "z.object("
      - "safeParse(process.env)"
    must_not_contain:
      - "envSchema.parse("
    rationale: |
      Validation at startup catches missing env vars immediately; reading
      `process.env.VAR` unvalidated fails silently at runtime.

      The assertion was `.parse(process.env)`, which the detail file's own
      `safeParse` does not contain — the summary and the detail file disagreed
      and the case enforced the weaker of the two. safeParse is the better
      standard for a file full of secrets: a thrown ZodError leaves module load
      with the environment in the frame, and a crash reporter captures the frame.
      An answer that throws instead of returning a result scores 0.

  - id: env-02
    name: "No secrets in VITE_ prefixed variables"
    scenario: |
      Write the env configuration for a Vite/React front end and its Node.js
      API. The app takes payments through Stripe, signs its sessions with a JWT
      secret, and connects to Postgres. Include the browser-visible variables
      the front end needs alongside the server-only ones. Write the variables
      themselves — no worked counter-examples.
      Use the env-secrets skill rules.
    must_contain:
      - "VITE_"
      - "JWT_SECRET"
      - "DATABASE_URL"
    must_not_contain:
      - "VITE_JWT"
      - "VITE_DATABASE"
      - "VITE_DB_"
      - "VITE_STRIPE_SECRET"
      - "VITE_API_SECRET"
      - "VITE_SECRET"
      - "VITE_PRIVATE"
    rationale: |
      VITE_ variables are bundled into the client JavaScript — publicly
      visible to anyone. Never prefix secrets with VITE_.

      The guards were `VITE_API_SECRET` and `VITE_DB_`, two names nobody writes.
      `VITE_STRIPE_SECRET_KEY=`, `VITE_JWT_SECRET=` and `VITE_DATABASE_URL=`
      evade both and scored 3/3 — and the lone positive, `VITE_`, was satisfied
      by the leaking lines themselves, so the case could be passed entirely by
      the defect it exists to catch.

      The rule is "no secret may carry a client-exposed prefix", so each guard
      is now the public prefix joined to a secret-ish stem, and each is written
      at its shortest safe form so the longer spellings fall inside it:
      `VITE_JWT` covers `VITE_JWT_SECRET` and `VITE_JWT_SIGNING_KEY`,
      `VITE_STRIPE_SECRET` covers `VITE_STRIPE_SECRET_KEY`, and
      `VITE_DATABASE` covers `VITE_DATABASE_URL` and `VITE_DATABASE_PASSWORD`.
      A publishable key — `VITE_STRIPE_PUBLISHABLE_KEY` — matches none of them,
      which is the point: the prefix is not the defect, the pairing is.

      The scenario names the three secrets so the positives can be paired with
      the guards. `JWT_SECRET` and `DATABASE_URL` are also substrings of their
      leaking forms, so on their own they prove nothing; with `VITE_JWT` and
      `VITE_DATABASE` forbidden, the only way to satisfy all five assertions is
      to write both secrets unprefixed and something public prefixed.

      No guard's literal appears in the layer's guidance, which mentions the
      prefix only as bare `VITE_`. The scenario rules out worked
      counter-examples, because an answer that illustrates the leak in order to
      forbid it writes the forbidden string and would score 0 for being right.

  - id: env-03
    name: ".env.example committed and .env gitignored"
    scenario: |
      Show the environment-file setup for the repo: which files are committed,
      which are never committed, and the `.gitignore` entries that keep the real
      values out of version control. Use the env-secrets skill rules.
    must_contain:
      - ".env.example"
      - ".gitignore"
      - ".env.*.local"
    rationale: |
      .env.example documents required variables without values.
      .env must be in .gitignore so real secrets are never committed.

      Both original literals are satisfied by any answer that merely *discusses*
      env files — an answer whose setup instructions read `git add .env` scored
      2/2 while committing the file the case exists to keep out of the repo.
      Nothing in the pair required the ignore rules to have been written.

      `.env.*.local` is the third: it appears only inside the layer's required
      `.gitignore` block, never in its prose or its file-hierarchy listing, so it
      is present exactly when the answer actually produced the ignore entries.
      The obvious guard on the defect is unusable — `git add .env` is a substring
      of the compliant `git add .env.example` — so the case tests for the
      artefact instead of against the instruction.

  - id: env-04
    name: "The config object cannot dump its secrets into a log"
    scenario: |
      Write the config module that validates and exports the environment, and
      the startup log line that records what was loaded. The app reads its
      database URL, JWT secret and Stripe key from it.
      Use the env-secrets skill rules.
    must_contain:
      - "nodejs.util.inspect.custom"
      - "toJSON"
    must_not_contain:
      - "${config.JWT_SECRET}"
      - "console.error(parsed.data"
    rationale: |
      "Never log env var values" was the layer's own rule and no case tested it,
      while the exported `config` concentrated every secret the process has into
      one object with nothing said about the consequence. One `console.log` of it
      dumps the lot.

      - `nodejs.util.inspect.custom` scores 0 against the bare
        `export const config = parsed.data` this layer used to ship, and 1 only
        when the object is protected on the console.log path. The literal is
        written without surrounding quotes so it matches either quoting style.
      - `toJSON` covers the other route out of a JS value, the one most loggers
        take. An answer that guards inspect but serialises in full still leaks
        through a structured logger, and scores 0.
      - `${config.JWT_SECRET}` fires on interpolating a secret into a string —
        the leak that redaction cannot catch, because it never touches the
        object. A compliant answer passes the secret as an argument to the client
        that needs it, which does not match.
      - `console.error(parsed.data` fires on dumping the parsed environment when
        validation fails; the required form prints field names and messages.

      No guard's literal appears in the layer's guidance.
