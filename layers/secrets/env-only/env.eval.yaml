skill: env-secrets
skill_files:
  - layers/secrets/env-only/SKILL.md
  - layers/secrets/env-only/env-only.md
version: 1

cases:
  - id: env-01
    name: "Environment variables validated with Zod at startup"
    scenario: |
      Write the env validation module that checks required environment
      variables at app startup. Use the env-secrets skill rules.
    must_contain:
      - "z.object("
      - "safeParse(process.env)"
    must_not_contain:
      - "envSchema.parse("
    rationale: |
      Validation at startup catches missing env vars immediately; reading
      `process.env.VAR` unvalidated fails silently at runtime.

      The assertion was `.parse(process.env)`, which the detail file's own
      `safeParse` does not contain — the summary and the detail file disagreed
      and the case enforced the weaker of the two. safeParse is the better
      standard for a file full of secrets: a thrown ZodError leaves module load
      with the environment in the frame, and a crash reporter captures the frame.
      An answer that throws instead of returning a result scores 0.

  - id: env-02
    name: "No secrets in VITE_ prefixed variables"
    scenario: |
      Write the env configuration showing public and private variables
      for a Vite/React + Node.js app. Use the env-secrets skill rules.
    must_contain:
      - "VITE_"
    must_not_contain:
      - "VITE_API_SECRET"
      - "VITE_DB_"
    rationale: |
      VITE_ variables are bundled into the client JavaScript — publicly
      visible to anyone. Never prefix secrets with VITE_.

  - id: env-03
    name: ".env.example committed and .env gitignored"
    scenario: |
      Show the project setup for environment variable management.
      Use the env-secrets skill rules.
    must_contain:
      - ".env.example"
      - ".gitignore"
    rationale: |
      .env.example documents required variables without values.
      .env must be in .gitignore so real secrets are never committed.

  - id: env-04
    name: "The config object cannot dump its secrets into a log"
    scenario: |
      Write the config module that validates and exports the environment, and
      the startup log line that records what was loaded. The app reads its
      database URL, JWT secret and Stripe key from it.
      Use the env-secrets skill rules.
    must_contain:
      - "nodejs.util.inspect.custom"
      - "toJSON"
    must_not_contain:
      - "${config.JWT_SECRET}"
      - "console.error(parsed.data"
    rationale: |
      "Never log env var values" was the layer's own rule and no case tested it,
      while the exported `config` concentrated every secret the process has into
      one object with nothing said about the consequence. One `console.log` of it
      dumps the lot.

      - `nodejs.util.inspect.custom` scores 0 against the bare
        `export const config = parsed.data` this layer used to ship, and 1 only
        when the object is protected on the console.log path. The literal is
        written without surrounding quotes so it matches either quoting style.
      - `toJSON` covers the other route out of a JS value, the one most loggers
        take. An answer that guards inspect but serialises in full still leaks
        through a structured logger, and scores 0.
      - `${config.JWT_SECRET}` fires on interpolating a secret into a string —
        the leak that redaction cannot catch, because it never touches the
        object. A compliant answer passes the secret as an argument to the client
        that needs it, which does not match.
      - `console.error(parsed.data` fires on dumping the parsed environment when
        validation fails; the required form prints field names and messages.

      No guard's literal appears in the layer's guidance.
