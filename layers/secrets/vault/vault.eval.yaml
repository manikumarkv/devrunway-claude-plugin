skill: vault-secrets
skill_files:
  - layers/secrets/vault/SKILL.md
  - layers/secrets/vault/vault.md
version: 1

cases:
  - id: vault-01
    name: "AppRole or Kubernetes auth not root token"
    scenario: |
      Write the Vault authentication setup for a Kubernetes-deployed service.
      Use the vault-secrets skill rules.
    must_contain:
      - "kubernetes/login"
    must_not_contain:
      - "VAULT_TOKEN"
    rationale: |
      Root tokens have unlimited access and do not expire. AppRole and
      Kubernetes auth issue short-lived tokens with least-privilege policies.

      `kubernetes/login` used to appear only in the summary; the detail file now
      carries the login call, so the rule survives the path layer-consultant
      actually takes. The guard rejects the static-token shortcut, and the
      literal appears nowhere in the layer's guidance, so an answer reproducing
      the standards cannot trip it.

  - id: vault-02
    name: "Dynamic database credentials, with the lease captured"
    scenario: |
      Write the code to fetch dynamic PostgreSQL credentials from Vault and hand
      them to a connection pool, plus the log line that records that credentials
      were issued. Use the vault-secrets skill rules.
    must_contain:
      - "database/creds/"
      - "lease_id"
      - "lease_duration"
    must_not_contain:
      - "console.log(result"
      - "{ result }"
      - "{ creds }"
      - "{ credentials }"
      - "writeFileSync("
    rationale: |
      Dynamic credentials are generated per-request with a TTL. Static
      credentials are long-lived, shared, and hard to rotate.

      This case had no `must_not_contain` at all, so an answer that fetched the
      credentials and then logged the whole Vault response — a live database
      password, into whatever aggregator the service ships to — scored 1.

      `lease_id` and `lease_duration` are what make the fetch usable: an answer
      that keeps only `username` and `password` has thrown away the id needed to
      renew and the clock needed to schedule it, and scores 0. `writeFileSync(`
      rejects persisting a credential somewhere it outlives its lease.

      `console.log(result` was the only log guard, and it named one sink. A
      service that ships to an aggregator does not use `console.log` at all:
      `logger.info("vault issued credentials", { result })` is not
      `console.log(` in any part, and it scored 5/5 while putting a live
      database password into a searchable index. The guards now name the payload
      rather than the sink, in the three variable names a real answer gives the
      Vault response — `{ result }`, `{ creds }`, `{ credentials }` — which
      catches the shorthand-object argument every structured logger takes,
      whether it is `logger.info(msg, { result })` or pino's
      `logger.info({ result }, msg)`.

      The scenario now asks for the log line, so the compliant form is exercised
      rather than assumed: the layer says to log the `lease_id` only, and
      `logger.info("db credentials issued", { leaseId: lease.leaseId })` matches
      no guard. Nor does the compliant pool config, which the layer writes as
      explicit `password: lease.password` rather than a shorthand.

      None of the guards appears in the layer's guidance — the Kubernetes login
      reads the service account token with `readFileSync`, which does not match,
      and the guidance's own log lines carry `{ err }` and `{ leaseId: ... }`.

  - id: vault-03
    name: "The credential lease is renewed, not the token"
    scenario: |
      A long-running service holds dynamic PostgreSQL credentials from Vault.
      Write the code that keeps them alive before expiry, and what it does when
      they can no longer be extended. Use the vault-secrets skill rules.
    must_contain:
      - "sys/leases/renew"
      - "sys/leases/revoke"
      - "lease_id"
    must_not_contain:
      - "leaseDuration * 1000"
    rationale: |
      The layer conflated two different objects: it told you to renew a dynamic
      database credential with `auth.token.renewSelf()`, which renews the
      *token*. The Postgres role has its own lease. A service built to the old
      guidance keeps a healthy Vault token and loses its database role at
      `max_ttl` — a failure that reads like a database problem.

      `renewable` and `lease_id`, the old assertions, are both satisfied by that
      wrong implementation, which is how this case scored 1 against the defect it
      exists to catch. `sys/leases/renew` is the discriminator: a token-renewal
      answer does not contain it, and cannot be written to contain it.

      `sys/leases/revoke` is the second half. `max_ttl` is a ceiling no renewal
      crosses, so a renewal loop with no path to fresh credentials still dies —
      just later. The layer states the swap as three steps: fetch fresh
      credentials, rebuild the pool, then revoke the old lease. An answer that
      only renews contains none of them and scores 0.

      That second half was `database/creds/`, which tested where the code was
      pasted rather than whether the swap exists: a renewal module that imports
      the fetch — `import { getDynamicDbCreds } from "./dbCredentials"`, the
      shape the layer's own file is written in — has no `database/creds/` in it
      and scored 3/4 for being correctly factored, while an inlined
      `client.read("database/creds/myapp-api")` scored 4/4 for the same
      behaviour. `sys/leases/revoke` is written in the renewal module either
      way, because revoking the superseded lease is the renewal loop's job and
      not the fetcher's.

      The guard rejects scheduling the renewal at the full TTL, where the request
      races Vault's revocation; the compliant `leaseDuration * 0.75 * 1000` does
      not contain it.
