skill: aws-secrets-manager
skill_files:
  - layers/secrets/aws-secrets-manager/SKILL.md
  - layers/secrets/aws-secrets-manager/aws-secrets-manager.md
version: 1

cases:
  - id: sm-01
    name: "The cached secret value is reused until its TTL runs out"
    scenario: |
      Write the TypeScript utility a request handler calls to read a JSON secret
      from AWS Secrets Manager. The service must not call GetSecretValue on
      every request: show how a value fetched once is reused, and when it stops
      being reused. Use the aws-secrets-manager skill rules.
    must_contain:
      - "SecretsManagerClient"
      - "GetSecretValueCommand"
      - "expir"
    rationale: |
      Secrets Manager has rate limits. Caching the secret value prevents
      throttling on high-traffic services. New client per request wastes connections.

      The case is named for caching and neither assertion tested it: a utility
      that constructs a new `SecretsManagerClient` inside the function and sends
      a `GetSecretValueCommand` on every call — the exact defect, with no cache
      at all — scored 2/2.

      `expir` is the third. A cache that expires must name its expiry somewhere,
      and the literal is deliberately the common stem rather than one spelling:
      it matches the layer's own `expiresAt` and `expires_at`, and equally
      `expiry`, `expiresIn`, `expiration` and `expiredAt`. A no-cache
      implementation has no expiry to name and scores 0; there is nothing else
      in a `GetSecretValue` call that would produce the stem by accident.

      The scenario states the constraint the case is scoring rather than the
      shape of the answer, so an object-literal cache and a `Map` both pass.

  - id: sm-02
    name: "Secret id comes from configuration, not a literal in source"
    scenario: |
      Write the Python code that fetches the production database password from
      Secrets Manager. The secret's name is supplied to the process in an
      environment variable. Use the aws-secrets-manager skill rules.
    must_contain:
      - "SecretId="
      - "os.environ"
    must_not_contain:
      - "SecretId=\""
      - "SecretId='"
    rationale: |
      The reference is passed in, not written down: an ARN or name hardcoded in
      source ships one environment's secret id to every environment, and moving
      the secret means a code change.

      The assertion was `SecretId:`, the TypeScript spelling. boto3 takes
      `SecretId=`, so a compliant Python answer — the language of this layer's
      canonical loader — could not pass it. The scenario now names the language
      and the assertion matches it.

      `os.environ` was supposed to discriminate and did not: it is satisfied by
      any `os.environ` anywhere in the file, and a boto3 client is routinely
      built with `region_name=os.environ["AWS_REGION"]`. With that line present,
      `client.get_secret_value(SecretId="myapp/production/secrets")` — the
      hardcoded id this case exists to reject — scored 2/2.

      The guards tie the assertion to the secret id itself. A quote directly
      after `SecretId=` is a literal written into the source, in either of
      Python's two string delimiters; a reference passed in is
      `SecretId=secret_id` or `SecretId=os.environ["APP_SECRET_ID"]`, and
      neither matches. Both spellings are absent from the layer's guidance,
      whose every call site passes a variable.

  - id: sm-03
    name: "Rotation lambda handles AWSPENDING and AWSCURRENT stages"
    scenario: |
      Write the skeleton for a Secrets Manager rotation Lambda handler.
      Use the aws-secrets-manager skill rules.
    must_contain:
      - "AWSPENDING"
      - "AWSCURRENT"
    rationale: |
      Rotation lambdas must handle the four rotation stages. Missing
      AWSPENDING or AWSCURRENT stages breaks automatic rotation.

  - id: sm-04
    name: "Typed config object does not print its own secrets"
    scenario: |
      Write the typed Python config object that holds the database credentials,
      the JWT secret and the Stripe key loaded from Secrets Manager, plus the
      startup log line that records what was loaded and the connection string
      the database client needs. Use a frozen `@dataclass` — this project has no
      Pydantic dependency.
      Use the aws-secrets-manager skill rules.
    must_contain:
      - "field(repr=False)"
      - "safe_url"
    must_not_contain:
      - "{config}"
      - "{self.password}"
    rationale: |
      This layer was 3/3 green while its mandated config object was a
      `@dataclass(frozen=True)` with a bare `password: str`. Python generates
      `__repr__` from every field, so `print(config)`, an f-string startup log,
      a Sentry capture with `include_local_variables=True` or
      `pytest --showlocals` writes the database password, the JWT secret and the
      live Stripe key out in plaintext.

      Each assertion rejects a specific wrong implementation:

      - `field(repr=False)` scores 0 against the bare-annotation dataclass the
        layer used to ship — the exact defect. A correct answer cannot express
        the rule without it.
      - `safe_url` scores 0 against a config that offers only the real
        connection string, which is the shape that gets logged. It requires a
        masked form to exist for the log line the scenario asks for.
      - `{config}` fires on `logger.info(f"loaded {config}")` — interpolating
        the whole object, the leak that `repr=False` exists to stop. A compliant
        answer logs named non-secret fields, whose interpolations are
        `{config.host}` and the like, and does not match.
      - `{self.password}` fires on a connection string that embeds the raw
        password in an f-string. The required form quotes it, so a compliant
        answer contains `{quote_plus(self.password)}`, which does not match.

      Neither guard appears in the layer's own guidance.

      SKILL.md names `SecretStr` as an accepted alternative for projects on
      Pydantic, and a `SecretStr` answer scored 2/4 here — it satisfies neither
      `field(repr=False)` nor, usually, `safe_url`, while being exactly as safe
      to print. Substring assertions cannot express "either of these", so the
      scenario now rules the alternative out explicitly instead of leaving a
      compliant answer to fail on a coin toss. The choice is deliberate: the
      dataclass is the form the layer teaches in full, and it is the one whose
      default `__repr__` is the hazard the case is about. A project on Pydantic
      is covered by the guidance, not by this case.
