skill: aws-secrets-manager
skill_files:
  - layers/secrets/aws-secrets-manager/SKILL.md
  - layers/secrets/aws-secrets-manager/aws-secrets-manager.md
version: 1

cases:
  - id: sm-01
    name: "SecretsManagerClient with caching not per-request fetching"
    scenario: |
      Write a TypeScript utility that fetches a secret from AWS Secrets Manager
      with caching. Use the aws-secrets-manager skill rules.
    must_contain:
      - "SecretsManagerClient"
      - "GetSecretValueCommand"
    rationale: |
      Secrets Manager has rate limits. Caching the secret value prevents
      throttling on high-traffic services. New client per request wastes connections.

  - id: sm-02
    name: "Secret id comes from configuration, not a literal in source"
    scenario: |
      Write the Python code that fetches the production database password from
      Secrets Manager. Use the aws-secrets-manager skill rules.
    must_contain:
      - "SecretId="
      - "os.environ"
    rationale: |
      The reference is passed in, not written down: an ARN or name hardcoded in
      source ships one environment's secret id to every environment, and moving
      the secret means a code change.

      The assertion was `SecretId:`, the TypeScript spelling. boto3 takes
      `SecretId=`, so a compliant Python answer — the language of this layer's
      canonical loader — could not pass it. The scenario now names the language
      and the assertion matches it. `os.environ` is what discriminates: an answer
      that writes `get_secret_value(SecretId="myapp/production/secrets")` scores 0.

  - id: sm-03
    name: "Rotation lambda handles AWSPENDING and AWSCURRENT stages"
    scenario: |
      Write the skeleton for a Secrets Manager rotation Lambda handler.
      Use the aws-secrets-manager skill rules.
    must_contain:
      - "AWSPENDING"
      - "AWSCURRENT"
    rationale: |
      Rotation lambdas must handle the four rotation stages. Missing
      AWSPENDING or AWSCURRENT stages breaks automatic rotation.

  - id: sm-04
    name: "Typed config object does not print its own secrets"
    scenario: |
      Write the typed Python config object that holds the database credentials,
      the JWT secret and the Stripe key loaded from Secrets Manager, plus the
      startup log line that records what was loaded and the connection string
      the database client needs.
      Use the aws-secrets-manager skill rules.
    must_contain:
      - "field(repr=False)"
      - "safe_url"
    must_not_contain:
      - "{config}"
      - "{self.password}"
    rationale: |
      This layer was 3/3 green while its mandated config object was a
      `@dataclass(frozen=True)` with a bare `password: str`. Python generates
      `__repr__` from every field, so `print(config)`, an f-string startup log,
      a Sentry capture with `include_local_variables=True` or
      `pytest --showlocals` writes the database password, the JWT secret and the
      live Stripe key out in plaintext.

      Each assertion rejects a specific wrong implementation:

      - `field(repr=False)` scores 0 against the bare-annotation dataclass the
        layer used to ship — the exact defect. A correct answer cannot express
        the rule without it (Pydantic's `SecretStr` is the alternative, and the
        scenario asks for the dataclass this layer teaches).
      - `safe_url` scores 0 against a config that offers only the real
        connection string, which is the shape that gets logged. It requires a
        masked form to exist for the log line the scenario asks for.
      - `{config}` fires on `logger.info(f"loaded {config}")` — interpolating
        the whole object, the leak that `repr=False` exists to stop. A compliant
        answer logs named non-secret fields, whose interpolations are
        `{config.host}` and the like, and does not match.
      - `{self.password}` fires on a connection string that embeds the raw
        password in an f-string. The required form quotes it, so a compliant
        answer contains `{quote_plus(self.password)}`, which does not match.

      Neither guard appears in the layer's own guidance.
