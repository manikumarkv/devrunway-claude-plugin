skill: grpc-api
skill_files:
  - layers/api-style/grpc/SKILL.md
  - layers/api-style/grpc/grpc.md
version: 1

cases:
  - id: grpc-01
    name: "Proto3 with google.protobuf.Timestamp for times"
    scenario: |
      Write a protobuf definition for an Order message with id, userId,
      total (money), and createdAt timestamp. Use the grpc-api skill rules.
    must_contain:
      - "proto3"
      - "google.protobuf.Timestamp"
    must_not_contain:
      - "string created_at"
      - "int64 timestamp"
    rationale: |
      google.protobuf.Timestamp is the canonical time type in proto3.
      String or int64 timestamps lose timezone information and type safety.

  - id: grpc-02
    name: "reserved statements sit inside the message body"
    scenario: |
      Write a protobuf UserRequest message that has previously removed fields.
      Show reserved field numbers. Use the grpc-api skill rules.
    must_contain:
      - "message "
      - "  reserved "
      - "= 1;"
    must_not_contain:
      - "\nreserved "
    rationale: |
      reserved blocks prevent field number reuse after field deletion,
      avoiding wire compatibility bugs when old clients communicate with
      new servers. But reserved is only valid INSIDE a message or enum body:
      verified with protoc 29.3, a file with the statements after the closing
      brace fails with "Expected top-level statement (e.g. \"message\")", so
      the whole schema is uncompilable and no client or server is generated.

      The assertions guard indentation, which is what distinguishes the two
      placements in a flat substring match. "  reserved " requires the
      statement to be nested (a 4-space-indented answer still contains it),
      and "\nreserved " rejects a reserved statement starting at column 0 —
      file scope. That guards the property rather than one syntax: it fires on
      every file-scope spelling, including the one the layer itself used, where
      a comment line sits between the closing brace and the statement, which a
      guard anchored on "}" would miss.

  - id: grpc-03
    name: "Generated files excluded from version control"
    scenario: |
      Write a .gitignore entry and build script that generates gRPC code
      from protos. Use the grpc-api skill rules.
    must_contain:
      - ".gitignore"
    must_not_contain:
      - "generated files committed"
    rationale: |
      Generated protobuf files must not be committed. They are artifacts
      produced from the .proto source files during the build.
