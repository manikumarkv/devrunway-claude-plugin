skill: neon
skill_files:
  - layers/database/neon/SKILL.md
  - layers/database/neon/neon.md
version: 1

cases:
  - id: neon-01
    name: "Migrations run against the unpooled connection string"
    scenario: |
      Write the CI step that applies pending schema migrations to a Neon
      database before deploy. Use the neon skill rules.
    must_contain:
      - "DATABASE_URL_UNPOOLED"
    rationale: |
      The pooled connection routes through PgBouncer in transaction mode, which
      drops session state. Migrations run through it fail intermittently rather
      than cleanly, producing a green CI run against a broken schema.

  - id: neon-02
    name: "Explicit column projection and a bounded result set"
    scenario: |
      Using the @neondatabase/serverless HTTP driver, write the raw SQL query
      that returns one page of users for an API list endpoint. The users table
      has a wide JSONB settings column that the list does not display.
      Use the neon skill rules.
    must_contain:
      - "LIMIT"
    must_not_contain:
      - "SELECT *"
      - "select *"
    rationale: |
      Neon bills egress. Unprojected queries transfer every column of every row,
      and wide JSONB columns dominate that cost. Every list query needs a bound
      or the bill scales with the table.
      Scenario pins raw SQL so the LIMIT keyword is deterministic — an earlier
      version asserted lowercase "limit" and would have failed valid SQL.

  - id: neon-03
    name: "Interactive transaction uses a per-invocation WebSocket Pool"
    scenario: |
      Write a Neon function running on a serverless runtime that transfers an
      amount between two account rows atomically, reading the sender's balance
      inside the transaction and aborting if it is insufficient.
      Use the neon skill rules.
    must_contain:
      - "Pool"
      - "BEGIN"
      - "pool.end("
    must_not_contain:
      - "= neon("
      - "\nconst pool = new Pool("
    rationale: |
      Each HTTP call via neon() is its own implicit transaction, so two
      sequential calls permit a partial transfer.

      Verified against @neondatabase/serverless@1.1.0: the HTTP driver DOES
      expose sql.transaction(), which runs a fixed batch of statements as one
      non-interactive transaction — so "the HTTP driver cannot do transactions"
      is too strong, and a batch answer to the old scenario would have been
      correct while failing "= neon(". The scenario now pins the interactive
      case — read the balance, then decide — which sql.transaction() genuinely
      cannot express, because its queries are fixed before the batch is sent.

      "pool.end(" guards the lifecycle property the layer's §3 requires and its
      §2 example used to violate: the Pool must be created and closed inside the
      invocation. The vendor README states the same rule verbatim — "*don't*
      create a `Pool` or `Client` here, outside the request handler" and "end the
      `Pool` inside the same request handler". A Pool cached in a module global
      is never ended per invocation, so it fails this assertion. The
      "\nconst pool = new Pool(" literal catches the module-scope declaration
      directly, by column-0 placement rather than by name lookup; the layer's
      own §2 example is indented inside the handler, so it does not trip it.

      Known residual: an answer that both caches the Pool at module scope as
      `export const pool = ...` AND calls pool.end() in the handler would score
      1. That literal is not guarded because §3's long-lived-process `pg`
      example writes exactly it, correctly, and guarding it would fire on the
      layer's own text. The combination is not an idiomatic spelling of the
      caching anti-pattern — caching exists precisely to avoid closing.

      Asserts on the assignment "= neon(" rather than "neon(" so that a comment
      explaining why the HTTP driver is unsuitable does not fail the case.

  - id: neon-04
    name: "Edge one-shot read uses the HTTP driver, not a Pool"
    scenario: |
      Write the database client setup and handler for a Neon-backed edge
      function that serves a single read query per request.
      Use the neon skill rules.
    must_contain:
      - "neon("
    must_not_contain:
      - "new Pool("
      - "rejectUnauthorized: false"
    rationale: |
      A single read on an edge runtime is the HTTP driver's case. A WebSocket
      Pool there is the cached-client anti-pattern: a frozen sandbox resumes
      holding a connection the server already closed.
      Replaces an earlier version whose assertions only checked TLS flags and
      so passed a module-global Pool — the exact thing the case claimed to test.

  - id: neon-05
    name: "Connection settings account for scale-to-zero cold start"
    scenario: |
      Configure the connection timeout and the connection-error retry policy
      for a Node application talking to a Neon branch that has scale-to-zero
      enabled. Use the neon skill rules.
    must_contain:
      - "connectionTimeoutMillis"
      - "retry"
    must_not_contain:
      - "connectTimeoutMS"
    rationale: |
      Idle compute suspends after ~5 minutes and the first query afterwards pays
      a cold start of several hundred milliseconds, which can surface as a
      connection error rather than a slow query — hence retry-once.
      connectTimeoutMS is the MongoDB option name; pg and @neondatabase/serverless
      use connectionTimeoutMillis. Asserting its absence catches that carry-over.
      An earlier version asserted "timeout: 500", which also matched the fully
      compliant "timeout: 5000".
