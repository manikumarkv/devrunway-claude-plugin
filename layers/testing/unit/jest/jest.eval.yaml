skill: jest-testing
skill_files:
  - layers/testing/unit/jest/SKILL.md
  - layers/testing/unit/jest/jest.md
version: 1

cases:
  - id: jest-01
    name: "describe and it blocks for structure"
    scenario: |
      Write Jest tests for a UserService.getById method.
      Use the jest-testing skill rules.
    must_contain:
      - "describe("
      - "it("
      - "expect("
    rationale: |
      describe groups related tests; it describes a single behavior.
      Top-level test() without describe makes large test files unorganised.

  - id: jest-02
    name: "jest.mock for module dependencies"
    scenario: |
      Write a Jest test for a service that depends on a repository.
      Mock the repository. Use the jest-testing skill rules.
    must_contain:
      - "jest.mock("
      - "mockReturnValue("
    rationale: |
      jest.mock replaces the module with a controllable fake. Direct imports
      of implementations make unit tests depend on real infrastructure.

  - id: jest-03
    name: "Mock cleanup between tests is configured, with real config keys"
    scenario: |
      Write the jest.config.ts for a TypeScript project so that mocks and spies
      never leak between tests, with a setup file and an 80% coverage floor.
      Use the jest-testing skill rules.
    must_contain:
      - "clearMocks: true"
      - "restoreMocks: true"
      - "setupFilesAfterEnv"
      - "coverageThreshold"
    must_not_contain:
      - "setupFilesAfterFramework"
      - "coverageThresholds"
    rationale: |
      clearMocks clears mock.calls/instances before every test (it keeps
      implementations; resetMocks/resetAllMocks drops them) and restoreMocks
      restores jest.spyOn originals, so config-level cleanup covers every file
      without a hand-written beforeEach. The negatives are the two misspelled
      keys this layer previously taught: Jest ignores unknown config keys
      silently, so a setup file or coverage floor written with them never runs.
