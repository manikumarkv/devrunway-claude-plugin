skill: redux-state
skill_files:
  - layers/state/redux-toolkit/SKILL.md
  - layers/state/redux-toolkit/redux-toolkit.md
version: 1

cases:
  - id: redux-01
    name: "createSlice not hand-written action creators and reducers"
    scenario: |
      Write a Redux slice for a products feature with add, remove, and update
      actions. Use the redux-state skill rules.
    must_contain:
      - "createSlice("
      - "reducers:"
    must_not_contain:
      - "switch (action.type)"
    rationale: |
      createSlice generates action creators and reduces boilerplate.
      Hand-written switch reducers and action creators are error-prone.

  - id: redux-02
    name: "RTK Query for server state not createAsyncThunk"
    scenario: |
      Write RTK Query endpoints to fetch and create products.
      Use the redux-state skill rules.
    must_contain:
      - "createApi("
      - "endpoints:"
    must_not_contain:
      - "createAsyncThunk"
    rationale: |
      RTK Query handles caching, loading states, and invalidation automatically.
      createAsyncThunk requires manual cache management.

  - id: redux-03
    name: "Typed hooks useAppDispatch and useAppSelector"
    scenario: |
      Write the typed Redux hooks setup and show usage in a component.
      Use the redux-state skill rules.
    must_contain:
      - "useAppDispatch("
      - "useAppSelector("
    must_not_contain:
      - "useDispatch<AppDispatch>()"
    rationale: |
      Typed hooks (useAppDispatch, useAppSelector) are defined once and
      provide full TypeScript inference everywhere they're used.

  - id: redux-04
    name: "baseQuery authenticates with the session cookie, not browser storage"
    scenario: |
      Write the RTK Query api slice for an authenticated API — show how each
      request is authenticated. Use the redux-state skill rules.
    must_contain:
      - "fetchBaseQuery("
      - "credentials:"
    must_not_contain:
      - "localStorage."
      - "localStorage["
      - "sessionStorage."
      - "sessionStorage["
    rationale: |
      The layer modelled `localStorage.getItem('auth_token')` in the canonical
      baseQuery — the one place every request in the app passes through, so the
      example set the app's credential store. Browser storage is readable by
      every script on the page and outlives the tab, which turns one XSS into a
      durable account takeover. That contradicts the always-on
      `security-principles` skill, and the two would be loaded together for the
      same file.

      The guards reject the pattern the layer used to teach, in both its
      spellings. `credentials:` is what a correct answer has and the storage
      answer does not — an httpOnly cookie is attached by the browser, so there
      is nothing to read and nothing to set a header from. Both compliant shapes
      the layer now documents satisfy it: the same-origin cookie session, and the
      cross-origin variant that keeps a bearer token in a module variable and
      refreshes it from an httpOnly cookie.

      The guards used to be `localStorage.getItem(` and
      `sessionStorage.getItem(`, which named one accessor. `getItem` is not the
      only way in: `window.localStorage['auth_token']` is the same read and
      matches neither. That case only failed today because the storage answer
      also omits `credentials:`; an answer that read the token by bracket and
      sent `credentials: 'include'` anyway — belt and braces, and a very natural
      thing to write — would have scored 4/4 while keeping the token exactly
      where an XSS can reach it. The guards are now the object plus its two
      access forms, so `getItem`, `setItem`, `removeItem`, `.token` and
      `['auth_token']` are all covered.

      No guard's literal appears in the layer's guidance — the rule is written
      as "browser storage (`localStorage`, `sessionStorage`)", each in backticks
      and followed by a comma or a space, never by a `.` or a `[` — so an answer
      reproducing the warning cannot trip the assertion.
