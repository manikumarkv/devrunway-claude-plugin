skill: stack-dispatcher
skill_files:
  - agents/stack-dispatcher.md
  - agents/code-reviewer.md
  - agents/debugger.md
  - agents/eval-runner.md
  - agents/layer-consultant.md
  - agents/security-reviewer.md
  - agents/skill-forge.md
version: 1

cases:
  - id: dispatcher-01
    name: "Discovers installed layers via find on layers/ tree"
    scenario: |
      You are the stack-dispatcher agent. The caller passes:
        task: generate a Zod schema for a User object
        target_files: ["src/schemas/user.schema.ts"]
      Describe the exact discovery step you will take to enumerate installed layers,
      then produce the DISPATCH RESULT block with the layers you will consult.
      Use the stack-dispatcher skill rules.
    must_contain:
      - "find layers"
      - "DISPATCH RESULT"
      - "Layers consulted:"
    must_not_contain:
      - "stack.json"
    rationale: |
      Installed layers are discovered by scanning the filesystem, not by reading
      stack.json (which is install-time only). The dispatcher must never depend
      on stack.json at runtime.

  - id: dispatcher-02
    name: "Fans out to layer-consultant via Task tool in parallel"
    scenario: |
      You are the stack-dispatcher agent. The caller passes:
        task: review a React component
        target_files: ["src/components/LoginForm.tsx"]
      Two layers match the paths globs: frontend/react and auth/cognito.
      Describe how you will invoke the consultants and produce the final
      DISPATCH RESULT block. Use the stack-dispatcher skill rules.
    must_contain:
      - "layer-consultant"
      - "parallel"
      - "DISPATCH RESULT"
    must_not_contain:
      - "react-standards.md"
      - "cognito-auth.md"
    rationale: |
      Dispatcher must spawn consultants in parallel via the Task tool, and must
      never load the detail .md files itself — that would defeat the purpose
      of forking to keep the caller's context light.

  - id: dispatcher-03
    name: "Caps at 5 layers and returns NO_LAYERS_MATCHED when nothing matches"
    scenario: |
      You are the stack-dispatcher agent. The caller passes:
        task: edit a markdown documentation file
        target_files: ["docs/README.md"]
      No installed layer's paths globs match this file.
      Produce the correct output per your instructions.
      Use the stack-dispatcher skill rules.
    must_contain:
      - "NO_LAYERS_MATCHED"
    must_not_contain:
      - "DISPATCH RESULT"
    rationale: |
      When zero layers match, dispatcher must return the explicit sentinel so
      the caller can proceed without layer guidance — not invent rules or load
      unrelated layers.

  - id: dispatcher-04
    name: "Discovery scan is not depth-capped"
    scenario: |
      You are the stack-dispatcher agent. The caller passes:
        task: review a React component and its Prisma-backed repository
        target_files: ["src/components/UserCard.tsx", "src/db/user.repository.ts"]
      Several installed layers are nested more than three directories deep, for
      example layers/frontend/react/react-standards/SKILL.md and
      layers/logging/framework/pino/logging-standards/SKILL.md.
      State the exact discovery command you run to enumerate installed layers.
      Use the stack-dispatcher skill rules.
    must_contain:
      - "find layers"
      - "-mindepth 3"
    must_not_contain:
      - "-mindepth 3 -maxdepth"
    rationale: |
      Layer directories are not at a fixed depth — 33 of 152 sit at depth 4 or 5.
      A depth-capped scan drops them silently, with no error: they simply never
      load. This shipped for real, and dispatcher-01 could not catch it because
      the buggy command `find layers -name SKILL.md -mindepth 3 -maxdepth 3`
      also contains the literal "find layers" that case asserts.
      Targets the buggy command shape rather than the bare "-maxdepth" flag: the
      skill file itself says "Never add -maxdepth to this search", so asserting
      absence of the bare flag would reject a correct answer that quotes that
      guidance.

  - id: dispatcher-05
    name: "Layers with no paths frontmatter are reported, not silently dropped"
    scenario: |
      You are the stack-dispatcher agent. The caller passes:
        task: add a feature flag to a service
        target_files: ["src/services/billing.service.ts"]
      One installed layer on disk has no `paths:` frontmatter and so cannot be
      routed by file pattern. Produce the DISPATCH RESULT block.
      Use the stack-dispatcher skill rules.
    must_contain:
      - "Unroutable"
    rationale: |
      A layer that cannot be routed is a configuration gap. Skipping it in
      silence is how those layers went unnoticed; surfacing it on the Unroutable
      line makes the gap visible to the caller.

  - id: dispatcher-06
    name: "Scope line of a colliding layer reaches the dispatch result"
    scenario: |
      You are the stack-dispatcher agent. The caller passes:
        task: write a Zod schema for the User object
        target_files: ["src/schemas/user.schema.ts"]
      Four installed layers match this file on shared globs — validation/zod,
      validation/joi, validation/yup and validation/valibot. All four are within
      the 5-layer cap, so all four are consulted. Each of their SKILL.md files
      opens its body with a scope blockquote. Two of them read, verbatim:

      > **Scope — applies only if this project uses zod.** This layer shares `**/*.schema.ts` with `joi`, `valibot`, `yup` in `layers/validation/`, so more than one may load at once and their rules conflict. If the project is not using zod, ignore this layer.
      > See `docs/adr/0001-layer-glob-collision-and-dispatcher-routing-policy.md`.

      > **Scope — applies only if this project uses joi.** This layer shares `**/*.schema.js`, `**/*.schema.ts`, `**/schemas/**` with `valibot`, `yup`, `zod` in `layers/validation/`, so more than one may load at once and their rules conflict. If the project is not using joi, ignore this layer.
      > See `docs/adr/0001-layer-glob-collision-and-dispatcher-routing-policy.md`.

      The consultants have already returned their LAYER/SOURCE/ALWAYS/NEVER blocks.
      Produce the DISPATCH RESULT block exactly as your instructions specify, with
      nothing before or after it. Use the stack-dispatcher skill rules.
    must_contain:
      - "DISPATCH RESULT"
      - "SCOPE:"
      - "applies only if this project uses zod"
      - "applies only if this project uses joi"
      - "ignore this layer"
    rationale: |
      ADR 0001 calls the per-layer scope line the load-bearing part of its
      decision: shared globs are added to, never removed, so competing layers
      still load together and the scope line is the only thing that lets the
      reader discard the ones that do not apply. The line lives in SKILL.md,
      which layer-consultant opens only to learn the layer name — its return
      template has no slot for a scope statement and its hard limits forbid
      closing commentary, so the consultant drops it. The dispatcher already
      reads every SKILL.md for `paths:` globs, so it is the agent that must
      carry the line through to the caller.
      Asserts the text after the em dash rather than the whole quoted sentence
      so a straight-vs-curly punctuation difference cannot fail a compliant
      answer, and asserts two different layers so a single hoisted note above
      the sections does not pass in place of per-layer attribution.

  - id: dispatcher-07
    name: "No scope line is fabricated for layers that do not carry one"
    scenario: |
      You are the stack-dispatcher agent. The caller passes:
        task: review a React component
        target_files: ["src/components/UserCard.tsx"]
      Two layers match: frontend/react/react-standards (on `**/*.tsx`) and
      frontend/react/composition-patterns (on `**/components/**`). Neither
      layer's SKILL.md contains a scope blockquote — neither collides with a
      competing sibling. The consultants have already returned their
      LAYER/SOURCE/ALWAYS/NEVER blocks.
      Produce the DISPATCH RESULT block exactly as your instructions specify, with
      nothing before or after it. Use the stack-dispatcher skill rules.
    must_contain:
      - "DISPATCH RESULT"
      - "Layers consulted:"
    must_not_contain:
      - "SCOPE:"
      - "applies only if this project uses"
    rationale: |
      Only 65 of the installed layers carry a scope line, so the common case is
      a layer with none. The failure mode this guards is the mirror of
      dispatcher-06: a dispatcher told to surface scope lines inventing an
      applicability claim, or emitting a placeholder such as `SCOPE: none`, for
      a layer whose author never made one. Both assertions target text the
      dispatcher can only produce by fabricating — the scenario states outright
      that neither SKILL.md has the blockquote, and the skill file forbids
      `SCOPE: none` explicitly, so a compliant answer cannot contain either
      string.
