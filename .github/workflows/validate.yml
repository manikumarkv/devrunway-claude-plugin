name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: Claude Code plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: claude plugin validate .

  structure:
    name: Frontmatter, manifests, cross-references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate plugin tree
        run: python3 scripts/ci/validate_plugin.py
      - name: Layer index is up to date
        run: python3 scripts/build_layer_index.py --check

  hooks:
    name: Hook scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          status=0
          for f in hooks/scripts/*.sh scripts/ci/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; status=1; }
          done
          exit $status
      - name: ShellCheck (errors only)
        run: shellcheck -S error hooks/scripts/*.sh scripts/ci/*.sh
      - name: Hook behaviour tests
        run: |
          git config --global init.defaultBranch main
          bash scripts/ci/test_hooks.sh
